<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web editor · Shader IDE</title>
<link rel="icon" href="img/icon.png">
<style>
  :root { --bg:#0b0a18; --panel:#141327; --line:#302c56; --dim:#a9a4cc; --text:#f3f0ff; --accent:#00d8ff; --accent2:#b65cff; --bad:#ff7a9a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Space Grotesk", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 18px; border-bottom:1px solid var(--line); }
  header a { color:var(--text); text-decoration:none; font-weight:700; }
  header select, header button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  header button.go { background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0b0a18; border:0; font-weight:700; }
  main { display:grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr); gap:16px; padding:16px; height: calc(100vh - 64px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height:auto; } }
  textarea { width:100%; height:100%; min-height:420px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:14px; font: 14px/1.5 "JetBrains Mono", ui-monospace, monospace; resize:none; tab-size:4; }
  .right { display:flex; flex-direction:column; gap:12px; min-height:0; }
  canvas { width:100%; aspect-ratio: 16 / 9; border-radius:12px; border:1px solid var(--line); background:#000; }
  #errors { flex:1; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; white-space:pre-wrap; color:var(--dim); }
  #errors.bad { color:var(--bad); }
  .hint { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  <a href="./">Shader IDE</a>
  <span class="hint">web editor</span>
  <select id="sample" aria-label="Starter sky"></select>
  <button id="reset" type="button">Reset to starter</button>
  <button id="download" type="button">Download .glsl</button>
</header>
<main>
  <textarea id="code" spellcheck="false" aria-label="GLSL code"></textarea>
  <div class="right">
    <canvas id="view" width="640" height="360"></canvas>
    <div id="errors">Compiling…</div>
    <p class="hint">Write <code>vec3 sky(vec3 dir, float time)</code>. The preview runs it live as you type. Your code stays in this browser only.</p>
  </div>
</main>
<script>
const SAMPLES = {"Aurora": "// a night sky with stars and a green and violet aurora rippling across the north\n\n// Random value for a 2D point. Used to decide which grid cells hold a star.\nfloat auHash(vec2 p) {\n    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);\n}\n\nvec3 sky(vec3 dir, float time) {\n    // Background: a deep night blue, slightly lighter toward the horizon.\n    vec3 color = mix(vec3(0.01, 0.02, 0.06), vec3(0.02, 0.05, 0.12), smoothstep(-0.2, 0.8, dir.y));\n\n    // Stars: split the sky into a grid and light about one cell in sixty as a small dot.\n    vec2 s = dir.xz * 90.0;\n    vec2 cell = floor(s);\n    float star = step(0.985, auHash(cell)) * smoothstep(0.45, 0.0, length(fract(s) - 0.5));\n    color += vec3(0.9, 0.95, 1.0) * star * smoothstep(0.0, 0.3, dir.y);\n\n    // The aurora: two slow waves make a ribbon that brightens in places and fades in others.\n    float wave = sin(dir.x * 5.0 + time * 0.4) * 0.5 + sin(dir.z * 7.0 - time * 0.3) * 0.5;\n    float curtain = smoothstep(0.0, 0.15, dir.y) * smoothstep(0.7, 0.2, dir.y);\n    float ribbon = smoothstep(0.4, 1.0, wave * 0.5 + 0.5);\n    vec3 aurora = mix(vec3(0.2, 1.0, 0.5), vec3(0.6, 0.3, 1.0), smoothstep(-0.3, 0.6, dir.y + wave * 0.2));\n    color += aurora * curtain * ribbon * 0.9;\n    return color;\n}\n", "Sunset": "// a warm sunset: a sun sinking into a gradient of orange and purple, with soft clouds drifting past its glow\n\nvec3 sky(vec3 dir, float time) {\n    // The gradient: gold at the horizon, orange above it, and deep purple at the top.\n    float h = clamp(dir.y, -0.2, 1.0);\n    vec3 top = vec3(0.25, 0.12, 0.35);\n    vec3 mid = vec3(0.95, 0.45, 0.25);\n    vec3 low = vec3(1.0, 0.8, 0.45);\n    vec3 color = mix(low, mid, smoothstep(0.0, 0.25, h));\n    color = mix(color, top, smoothstep(0.25, 0.9, h));\n\n    // The sun: a sharp disc and a soft halo around it, both pointing at sunDir.\n    vec3 d = normalize(dir);\n    vec3 sunDir = normalize(vec3(0.3, 0.12, -1.0));\n    float sunAmount = dot(d, sunDir);\n    float sun = smoothstep(0.985, 0.995, sunAmount);\n    float halo = pow(max(sunAmount, 0.0), 24.0);\n    color += vec3(1.0, 0.85, 0.5) * (sun * 2.0 + halo * 0.6);\n\n    // Clouds: a few soft bands that drift slowly across the glow.\n    float band = sin(dir.x * 6.0 + time * 0.1) * 0.5 + 0.5;\n    float cloud = smoothstep(0.6, 0.9, band) * smoothstep(0.02, 0.2, dir.y) * smoothstep(0.5, 0.1, dir.y);\n    color = mix(color, vec3(0.85, 0.4, 0.35), cloud * 0.4);\n    return color;\n}\n", "Synthwave": "// a synthwave horizon: a striped neon sun sitting on the horizon, and a glowing grid running out to it across the ground\n\nvec3 sky(vec3 dir, float time) {\n    // Sky gradient: magenta at the horizon, fading to deep purple above.\n    vec3 top = vec3(0.05, 0.0, 0.15);\n    vec3 horizon = vec3(0.6, 0.1, 0.45);\n    vec3 color = mix(horizon, top, smoothstep(0.0, 0.5, dir.y));\n\n    // Above the horizon: a sun with horizontal stripes cut through it, fading near the horizon.\n    if (dir.y >= 0.0) {\n        float sunAmount = dot(normalize(dir), normalize(vec3(0.0, 0.08, -1.0)));\n        float disc = smoothstep(0.985, 0.99, sunAmount);\n        float stripe = step(0.5, fract(dir.y * 30.0));\n        float fade = smoothstep(0.0, 0.12, dir.y);\n        vec3 sunColour = mix(vec3(1.0, 0.8, 0.2), vec3(1.0, 0.2, 0.5), dir.y * 3.0);\n        color += sunColour * disc * mix(0.3, 1.0, stripe * fade);\n    } else {\n        // Below the horizon: a perspective grid of glowing lines. Dividing by -dir.y makes the lines recede.\n        vec2 g = dir.xz / -dir.y;\n        g.y += time * 0.5;\n        vec2 f = abs(fract(g) - 0.5);\n        float line = smoothstep(0.47, 0.5, max(f.x, f.y));\n        color = vec3(0.02, 0.0, 0.08) + vec3(0.0, 0.9, 1.0) * line * exp(dir.y * 4.0);\n    }\n    return color;\n}\n"};
const KEY = "shader-ide-web-editor";
const code = document.getElementById("code");
const errors = document.getElementById("errors");
const sample = document.getElementById("sample");
const canvas = document.getElementById("view");
const gl = canvas.getContext("webgl2");

const HEAD = "#version 300 es\nprecision highp float;\nout vec4 fragColor;\nuniform float uTime;\nuniform vec2 uRes;\n";
const TAIL = "\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;\n  vec3 dir = normalize(vec3(uv.x * uRes.x / uRes.y, uv.y, -1.0));\n  fragColor = vec4(sky(dir, uTime), 1.0);\n}\n";
const VERT = "#version 300 es\nvoid main() {\n  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n";
const HEAD_LINES = HEAD.split("\n").length - 1;

let program = null;
let uTime = null, uRes = null;

function compile(source) {
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VERT);
  gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, HEAD + source + TAIL);
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    return { error: gl.getShaderInfoLog(fs) };
  }
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    return { error: gl.getProgramInfoLog(p) };
  }
  return { program: p };
}

// the compiler counts lines from the top of the whole shader, so the user's line is that line minus the header
function explain(log) {
  return log.split("\n").filter(l => l.trim()).map(l => {
    const m = l.match(/ERROR: \d+:(\d+):\s*(.*)/);
    if (!m) return l;
    const line = parseInt(m[1], 10) - HEAD_LINES;
    return "line " + (line > 0 ? line : "?") + ": " + m[2];
  }).join("\n");
}

function update() {
  localStorage.setItem(KEY, code.value);
  const result = compile(code.value);
  if (result.error) {
    errors.textContent = explain(result.error);
    errors.classList.add("bad");
    return;
  }
  if (program) gl.deleteProgram(program);
  program = result.program;
  uTime = gl.getUniformLocation(program, "uTime");
  uRes = gl.getUniformLocation(program, "uRes");
  errors.textContent = "No errors. The sky compiles.";
  errors.classList.remove("bad");
}

let timer = null;
code.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(update, 250);
});

for (const name of Object.keys(SAMPLES)) {
  const o = document.createElement("option");
  o.value = name;
  o.textContent = name;
  sample.appendChild(o);
}
sample.addEventListener("change", () => { code.value = SAMPLES[sample.value]; update(); });
document.getElementById("reset").addEventListener("click", () => { code.value = SAMPLES[sample.value]; update(); });
document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([code.value], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sky.glsl";
  a.click();
});

const saved = localStorage.getItem(KEY);
code.value = saved !== null ? saved : SAMPLES[Object.keys(SAMPLES)[0]];

if (!gl) {
  errors.textContent = "This browser has no WebGL 2, so the preview can't run. The code still works in the IDE.";
  errors.classList.add("bad");
} else {
  gl.useProgram(null);
  const buffer = gl.createVertexArray();
  gl.bindVertexArray(buffer);
  const start = performance.now();
  function frame() {
    if (program) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(program);
      gl.uniform1f(uTime, (performance.now() - start) / 1000);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(frame);
  }
  update();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
